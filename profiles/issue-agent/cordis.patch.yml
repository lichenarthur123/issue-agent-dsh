- id: tool-result-pruner
  config:
    thresholdChars: 4096
    headChars: 2048
    tailChars: 1024
- id: compaction-basic
  config:
    thresholdRatio: 0.55
    retainRatio: 0.12
    headroomTokens: 16384
    maxTokens: 4096
    compactionRetries: 1
    summarizationProvider: spark-planner
    summarizationModel: qwen3.8-27b-nvfp4
- id: llm-pi-ai
  config:
    providers:
      spark-planner:
        apiKeyEnv: DESKTOP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://10.10.10.1:8005/v1
        timeoutMs: 120000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking: false
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text]
            contextWindow: 65536
            maxTokens: 8192
      spark-executor:
        apiKeyEnv: DESKTOP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://10.10.10.1:8005/v1
        timeoutMs: 300000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
              omitWhenOff: false
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text, image]
            contextWindow: 65536
            maxTokens: 8192
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              xhigh: xhigh
      alicloud:
        apiKeyEnv: CUA_MODEL_API_KEY
        api: openai-completions
        baseURL: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        timeoutMs: 300000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: deepseek-v4.1-flash
            input: [text, image]
            maxTokens: 32768
- id: agent-default-model
  config:
    provider: alicloud
    model: deepseek-v4.1-flash
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-mcp
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
      config:
        command: cua-driver
        args: [mcp]
        toolCallTimeoutMs: 300000
