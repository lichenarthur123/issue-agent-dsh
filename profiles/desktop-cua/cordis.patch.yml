- id: llm-pi-ai
  config:
    providers:
      spark-planner:
        apiKeyEnv: GW_KEY
        api: openai-completions
        baseURL: http://39.97.8.6:8080/vision/v1
        timeoutMs: 600000
        streamIdleTimeoutMs: 600000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking: false
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text]
            contextWindow: 65536
            maxTokens: 8192
      spark-executor:
        apiKeyEnv: GW_KEY
        api: openai-completions
        baseURL: http://39.97.8.6:8080/vision/v1
        timeoutMs: 600000
        streamIdleTimeoutMs: 600000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
              omitWhenOff: false
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text, image]
            contextWindow: 65536
            maxTokens: 8192
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              xhigh: xhigh
      spark-planner-local:
        apiKeyEnv: DESKTOP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://10.10.10.1:8005/v1
        timeoutMs: 120000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking: false
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text]
            contextWindow: 65536
            maxTokens: 8192
      spark-executor-local:
        apiKeyEnv: DESKTOP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://10.10.10.1:8005/v1
        timeoutMs: 300000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
              omitWhenOff: false
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
        models:
          - id: qwen3.8-27b-nvfp4
            input: [text, image]
            contextWindow: 65536
            maxTokens: 8192
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              xhigh: xhigh
      spark-grounder:
        apiKeyEnv: GW_KEY
        api: openai-completions
        baseURL: http://39.97.8.6:8080/grounder/v1
        timeoutMs: 600000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: ui-tars-1.5-7b
            input: [text, image]
            contextWindow: 32768
            maxTokens: 512
          - id: gta1-7b
            input: [text, image]
            contextWindow: 32768
            maxTokens: 512
      spark-grounder-local:
        apiKeyEnv: DESKTOP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://10.10.10.1:8003/v1
        timeoutMs: 120000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: ui-tars-1.5-7b
            input: [text, image]
            contextWindow: 32768
            maxTokens: 512
          - id: gta1-7b
            input: [text, image]
            contextWindow: 32768
            maxTokens: 512
      alicloud:
        apiKeyEnv: CUA_MODEL_API_KEY
        api: openai-completions
        baseURL: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        timeoutMs: 300000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: deepseek-v4.1-flash
            input: [text, image]
            maxTokens: 32768
- id: agent-default-model
  config:
    provider: alicloud
    model: deepseek-v4.1-flash
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-mcp
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
      config:
        command: cua-driver
        args: [mcp]
        toolCallTimeoutMs: 300000
