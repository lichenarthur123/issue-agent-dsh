- insert:
    - id: desktop-agent
      name: '@local/desktop-agent'
      config:
        artifactRoot: artifacts/native
        lockFile: artifacts/desktop.lock
        taskTimeoutSeconds: 600
        plannerEnabled: false
        browserProfileMode: existing_profile
        browserProfileName: issue-agent
        planner:
          provider: spark-executor
          model: qwen3.8-27b-nvfp4
        executor:
          provider: spark-executor
          model: qwen3.8-27b-nvfp4
        maxSteps: 50
        observationMode: screenshot
        thinkingMode: always
        thinkingEffort: low
        groundingMode: auto
        keepWindowsOnFailure: true
        memoryEnabled: false
        memoryRoot: memory
        memoryMaxLessons: 20
        grounder:
          # 走 DSH 的 LLM 抽象层：provider 定义在 profiles/*/cordis.patch.yml
          provider: spark-grounder
          model: ui-tars-1.5-7b
        budget:
          maxDesktopCalls: 1000
          maxObservationCalls: 400
          maxObservationElements: 1500
        policy:
          blockedTools:
            - kill_app
          blockedShortcuts:
            - cmd+q
            - cmd+shift+q
            - cmd+opt+esc
            - ctrl+cmd+q
          allowedApps: []
          allowedUrlHosts: []